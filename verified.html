<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified - CarpMarks</title>
  <style>
    :root {
      --primary: #0A4D68;
      --primary-dark: #05293D;
      --accent: #D4A574;
      --text: #0D1117;
      --text-secondary: #4B5563;
      --background: #F9FAFB;
      --white: #FFFFFF;
      --grey-light: #F3F4F6;
      --success: #10B981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: var(--white);
      padding: 20px;
      text-align: center;
    }

    .header a {
      color: var(--white);
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: 600;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 50px 40px;
      text-align: center;
      max-width: 450px;
      width: 100%;
    }

    .icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--success), #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
    }

    .icon svg {
      width: 40px;
      height: 40px;
      color: var(--white);
    }

    h1 {
      color: var(--text);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--success);
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .message {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 30px;
    }

    .cta {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--white);
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(10, 77, 104, 0.3);
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="index.html">CarpMarks</a>
  </header>

  <main class="main">
    <div class="card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h1>Welcome!</h1>
      <p class="subtitle">Your email has been verified</p>
      <p class="message">
        Your account is now fully activated. You're all set to start tracking your fishing spots and catches with CarpMarks.
      </p>
      <a href="index.html" class="cta">Open the App</a>
    </div>
  </main>

  <footer class="footer">
    <p>Need help? <a href="mailto:support@carpmarks.com">Contact Support</a></p>
  </footer>
</body>

</html>
